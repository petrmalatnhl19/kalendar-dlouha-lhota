<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#134e55"><title>Kalendář akcí Dlouhá Lhota</title><style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:#f3f7f5;color:#193840}header{background:linear-gradient(120deg,#103c4e,#188679);color:white;padding:30px 18px 50px}header div,main{max-width:920px;margin:auto}h1{font-size:clamp(28px,5vw,46px);margin:8px 0}header p{opacity:.9}main{padding:0 16px 40px;margin-top:-24px;display:grid;gap:18px}.panel{background:white;border-radius:20px;padding:20px;box-shadow:0 8px 26px #1236;border:1px solid #e3ece9}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.bar h2{margin:0}button{font:inherit;cursor:pointer;border:0;border-radius:10px;background:#e7f2ef;color:#155b59;padding:10px 13px;font-weight:650}button.primary{background:#117a72;color:white}.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.week{margin:20px 0 8px;text-align:center;color:#678;font-size:12px}.day{min-height:67px;background:#f4f8f7;display:flex;flex-direction:column;align-items:center;gap:7px;padding:8px 2px}.day.out{opacity:.35}.day.today{outline:2px solid #16877e}.day.selected{background:#ccebe2}.dot{height:7px;width:7px;border-radius:50%;background:#d99535}.item{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid #edf1ef}.item:last-child{border:0}.date{background:#e2f2ec;padding:9px;border-radius:12px;min-width:56px;text-align:center}.date strong{font-size:23px;display:block}.grow{flex:1;min-width:0}.grow h3{margin:4px 0}.grow p{margin:0;color:#678;font-size:14px}.tag{font-size:12px;color:#166d66}.muted{color:#678}dialog{border:0;border-radius:18px;max-width:500px;width:calc(100% - 24px);box-shadow:0 25px 90px #0005}dialog::backdrop{background:#10252ac0}form{display:grid;gap:12px}label{display:grid;gap:5px;font-weight:600}input,textarea,select{font:inherit;padding:10px;border:1px solid #bacdc9;border-radius:9px;width:100%}textarea{min-height:100px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}#admin[hidden]{display:none}@media(max-width:440px){.panel{padding:13px}.day{min-height:49px}.item{gap:8px}}
</style></head><body><header><div><small>OBECNÍ KALENDÁŘ</small><h1>Dlouhá Lhota</h1><p>Akce a setkání v naší obci na jednom místě.</p></div></header><main>
<section class="panel"><div class="bar"><h2 id="month"></h2><div><button id="prev" aria-label="Předchozí měsíc">‹</button><button id="now">Dnes</button><button id="next" aria-label="Následující měsíc">›</button></div></div><div class="week"><span>Po</span><span>Út</span><span>St</span><span>Čt</span><span>Pá</span><span>So</span><span>Ne</span></div><div class="days" id="days"></div></section>
<section class="panel"><div class="bar"><h2 id="heading">Nadcházející akce</h2><button id="all">Všechny</button></div><div id="events"></div></section>
<section class="panel"><div class="bar"><div><b>Správa kalendáře</b><p class="muted" id="status">Veřejný režim</p></div><button id="login">Přihlášení správce</button></div><div id="admin" hidden><button class="primary" id="add">+ Přidat akci</button> <button id="logout">Odhlásit</button></div></section></main>
<dialog id="detail"><h2 id="detailTitle"></h2><div id="detailText"></div><div class="actions"><button id="closeDetail">Zavřít</button></div></dialog>
<dialog id="auth"><h2>Přihlášení správce</h2><form id="authForm"><label>E-mail<input name="email" type="email" required></label><label>Heslo<input name="password" type="password" required></label><p class="muted" id="authError"></p><div class="actions"><button type="button" id="cancelAuth">Zrušit</button><button class="primary">Přihlásit</button></div></form></dialog>
<dialog id="editor"><h2 id="editorHeading">Nová akce</h2><form id="eventForm"><input name="id" type="hidden"><label>Název<input name="title" required maxlength="120"></label><label>Datum<input name="event_date" type="date" required></label><label>Čas<input name="event_time" type="time"></label><label>Místo<input name="place" maxlength="150"></label><label>Kategorie<select name="category"><option>Kultura</option><option>Sport</option><option>Obecní</option><option>Pro děti</option><option>Ostatní</option></select></label><label>Popis<textarea name="description" maxlength="3000"></textarea></label><p class="muted" id="saveError"></p><div class="actions"><button type="button" id="cancelEdit">Zrušit</button><button class="primary">Uložit</button></div></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="./config.js"></script><script>
(()=>{'use strict';const $=x=>document.getElementById(x),cfg=window.LHOTA_CONFIG||{},connected=!!(cfg.url&&cfg.anonKey&&window.supabase),db=connected?window.supabase.createClient(cfg.url,cfg.anonKey):null;let month=new Date(),selected=null,events=[],admin=false;const key=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'),date=s=>new Date(s+'T12:00:00'),fmt=s=>date(s).toLocaleDateString('cs-CZ',{day:'numeric',month:'long',year:'numeric'});function node(tag,text,cls){const e=document.createElement(tag);if(text!==null)e.textContent=text;if(cls)e.className=cls;return e}
function render(){const first=new Date(month.getFullYear(),month.getMonth(),1),offset=(first.getDay()+6)%7,count=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();$('month').textContent=first.toLocaleDateString('cs-CZ',{month:'long',year:'numeric'});$('days').replaceChildren();for(let i=0;i<Math.ceil((offset+count)/7)*7;i++){const d=new Date(month.getFullYear(),month.getMonth(),i-offset+1),k=key(d),b=node('button',String(d.getDate()),'day');if(d.getMonth()!==month.getMonth())b.classList.add('out');if(k===key(new Date()))b.classList.add('today');if(k===selected)b.classList.add('selected');if(events.some(e=>e.event_date===k))b.append(node('span',null,'dot'));b.onclick=()=>{month=d;selected=k;render()};$('days').append(b)}$('heading').textContent=selected?'Akce: '+fmt(selected):'Nadcházející akce';$('events').replaceChildren();const filtered=events.filter(e=>selected?e.event_date===selected:e.event_date>=key(new Date())).sort((a,b)=>(a.event_date+(a.event_time||'')).localeCompare(b.event_date+(b.event_time||'')));if(!filtered.length)$('events').append(node('p',connected?'Žádné naplánované akce.':'Pro zveřejnění akcí je nutné připojit databázi Supabase.','muted'));for(const e of filtered){const item=node('div',null,'item'),day=node('div',null,'date');day.append(node('strong',String(date(e.event_date).getDate())),node('small',date(e.event_date).toLocaleDateString('cs-CZ',{month:'short'})));const body=node('div',null,'grow');body.append(node('span',e.category,'tag'),node('h3',e.title),node('p',[e.event_time?.slice(0,5),e.place].filter(Boolean).join(' • ')));const b=node('button','Detail');b.onclick=()=>detail(e);item.append(day,body,b);$('events').append(item)}$('admin').hidden=!admin;$('login').hidden=admin;$('status').textContent=!connected?'Čeká na nastavení Supabase':admin?'Přihlášený správce':'Veřejný režim – pouze prohlížení'}
function detail(e){$('detailTitle').textContent=e.title;const box=$('detailText');box.replaceChildren(node('p',fmt(e.event_date)+(e.event_time?' • '+e.event_time.slice(0,5):'')),node('p',e.place||'Místo neuvedeno'),node('p',e.description||'Bez popisu'));if(admin){const edit=node('button','Upravit'),del=node('button','Smazat');edit.onclick=()=>{$('detail').close();openEditor(e)};del.onclick=async()=>{if(!confirm('Opravdu smazat tuto akci?'))return;const {error}=await db.from('events').delete().eq('id',e.id);if(error)alert(error.message);else{$('detail').close();await load()}};box.append(edit,del)}$('detail').showModal()}
function openEditor(e){$('eventForm').reset();for(const [k,v] of Object.entries(e||{})){const input=$('eventForm').elements.namedItem(k);if(input)input.value=v??''}$('editorHeading').textContent=e?'Upravit akci':'Nová akce';$('saveError').textContent='';$('editor').showModal()}
async function load(){if(connected){const {data,error}=await db.from('events').select('*').order('event_date');if(error)$('status').textContent=error.message;else events=data||[]}render()}
async function check(){if(!connected)return;const {data:{session}}=await db.auth.getSession();admin=false;if(session){const {data}=await db.from('admins').select('user_id').eq('user_id',session.user.id).maybeSingle();admin=!!data}render()}
$('prev').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);render()};$('next').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);render()};$('now').onclick=()=>{month=new Date();selected=key(month);render()};$('all').onclick=()=>{selected=null;render()};$('closeDetail').onclick=()=>$('detail').close();$('cancelAuth').onclick=()=>$('auth').close();$('cancelEdit').onclick=()=>$('editor').close();
$('login').onclick=()=>{if(!connected){alert('Nejdříve nastav Supabase v config.js');return}$('authError').textContent='';$('auth').showModal()};$('authForm').onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.target),{error}=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error){$('authError').textContent='Přihlášení se nezdařilo.';return}await check();if(!admin){await db.auth.signOut();$('authError').textContent='Tento účet nemá oprávnění správce.';return}$('auth').close()};$('logout').onclick=async()=>{await db.auth.signOut();admin=false;render()};$('add').onclick=()=>openEditor(null);$('eventForm').onsubmit=async ev=>{ev.preventDefault();if(!admin)return;const f=new FormData(ev.target),id=f.get('id'),data={title:f.get('title'),event_date:f.get('event_date'),event_time:f.get('event_time')||null,place:f.get('place'),category:f.get('category'),description:f.get('description')};const {error}=await(id?db.from('events').update(data).eq('id',id):db.from('events').insert(data));if(error){$('saveError').textContent=error.message;return}$('editor').close();await load()};if(db)db.auth.onAuthStateChange(()=>setTimeout(check,0));check().then(load)})();
</script></body></html>
